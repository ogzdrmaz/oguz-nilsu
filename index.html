<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nişan Takımı Simülatörü</title>
<style>
:root{--bg:#0f0f12;--card:#1a1a1f;--tx:#f3ead9;--mut:#a79f90;--gold:#d9b98a;--ln:#33333b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f1e8;--card:#fffaf0;--tx:#1d1a16;--mut:#6f675a;--gold:#9a7440;--ln:#ddd2bd;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0f0f12;--card:#1a1a1f;--tx:#f3ead9;--mut:#a79f90;--gold:#d9b98a;--ln:#33333b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
h1{font:20px Georgia,serif;margin:0;color:var(--gold)}
header button{border:0;border-radius:10px;padding:8px 12px;background:linear-gradient(#ecd3a8,#d2ad78);color:#2a2116;font:600 13px system-ui,sans-serif}
main{flex:1;min-height:0;display:flex;justify-content:center;padding:0 14px}
canvas{height:100%;max-width:100%;object-fit:contain;border-radius:14px;border:1px solid var(--ln)}
.p{background:var(--card);border-top:1px solid var(--ln);padding:8px 12px 10px;border-radius:18px 18px 0 0}
.row{display:flex;align-items:center;gap:8px;padding:4px 0}
.row b{flex:0 0 58px;font-size:12px;color:var(--mut);font-weight:600}
.sw{display:flex;gap:8px;overflow-x:auto;flex:1;padding:3px 2px;scrollbar-width:none}
.o{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--tx);font-size:10px;padding:0;min-width:46px}
.o i{width:36px;height:36px;border-radius:50%;border:2px solid var(--ln);box-shadow:inset 0 0 0 2px var(--card)}
.o.on i{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--card),0 0 0 1px var(--gold)}
#m{display:none;position:fixed;inset:0;background:#000d;z-index:9;padding:16px;overflow:auto;text-align:center;color:#fff;font:14px system-ui,sans-serif}
#m img{max-width:100%;border-radius:12px;margin-top:8px}
</style></head><body>

const cv=document.getElementById('cv'),cx=cv.getContext('2d',{willReadFrequently:true});
const D={};let n=0;
function ld(k){const i=new Image();i.onload=()=>{D[k]=i;if(++n==4)init()};i.src=src[k]}
Object.keys(src).forEach(ld);
function px(i){const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const x=c.getContext('2d');x.drawImage(i,0,0);return x.getImageData(0,0,i.width,i.height).data}
let B,M={},ref={};
function lum(a,p){return(.3*a[p]+.59*a[p+1]+.11*a[p+2])/255}
function init(){cv.width=D.base.width;cv.height=D.base.height;B=px(D.base);
for(const k of ['suit','shirt','shoes']){M[k]=px(D[k]);let s=0,c=0;for(let p=0;p<B.length;p+=4){if(M[k][p]>128){s+=lum(B,p);c++}}ref[k]=(s/c)||.3}
ui();draw()}
function draw(){const o=cx.createImageData(cv.width,cv.height),d=o.data;
const T={suit:S.suit[sel.suit][1],shirt:S.shirt[sel.shirt][1],shoes:S.shoes[sel.shoes][1]};
for(let p=0;p<B.length;p+=4){let r=B[p],g=B[p+1],b=B[p+2];
for(const k of ['suit','shirt','shoes']){const t=T[k];if(!t)continue;const a=M[k][p]/255;if(a<.02)continue;
const L=lum(B,p);let q=Math.min(L/ref[k],k=='shoes'?3:1.7);
let hi=k=='shoes'?Math.max(0,L-.22)*255*.7:Math.max(0,q-1)*40;
const f=k=='shoes'?.55+.45*q:q;
const nr=Math.min(255,t[0]*f+hi),ng=Math.min(255,t[1]*f+hi),nb=Math.min(255,t[2]*f+hi);
r=r*(1-a)+nr*a;g=g*(1-a)+ng*a;b=b*(1-a)+nb*a}
d[p]=r;d[p+1]=g;d[p+2]=b;d[p+3]=255}
cx.putImageData(o,0,0)}
function ui(){for(const [k,id] of [['suit','g1'],['shirt','g2'],['shoes','g3']]){const el=document.getElementById(id);
el.innerHTML='';S[k].forEach((v,i)=>{const bt=document.createElement('button');bt.className='o'+(sel[k]==i?' on':'');
const col=v[1]?`rgb(${v[1]})`:({suit:'#1c2540',shirt:'#f4f4f4',shoes:'#111'})[k];
bt.innerHTML=`<i style="background:${col}"></i>${v[0]}`;bt.onclick=()=>{sel[k]=i;ui();draw()};el.appendChild(bt)})}}
document.getElementById('sv').onclick=()=>{document.getElementById('im').src=cv.toDataURL('image/jpeg',.92);document.getElementById('m').style.display='block'};
document.getElementById('x').onclick=()=>document.getElementById('m').style.display='none';
</script></body></html>
